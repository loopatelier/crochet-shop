<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Login | The Loop Atelier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Keep exact background unchanged */
    body { background: #F6F1EA; color: #2B2420; font-family: 'Plus Jakarta Sans', sans-serif; }
    .serif { font-family: 'Fraunces', serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[#FDFBF8] border border-[#E6DDD1] rounded-3xl p-8 shadow-sm">
    <div class="text-center mb-6">
      <span class="text-xs uppercase tracking-[0.2em] text-[#A65D47] font-semibold">Private Studio Access</span>
      <h1 class="serif text-3xl mt-1">The Loop Atelier</h1>
      <p class="text-sm text-[#7A6F66] mt-1">Sign in to manage products, orders &amp; UPI settings</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm text-center">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[#7A6F66] mb-1.5">Studio Email</label>
        <input type="email" name="email" required placeholder="admin@loopatelier.com"
          class="w-full px-4 py-3 rounded-xl bg-[#F6F1EA] border border-[#E6DDD1] focus:outline-none focus:border-[#A65D47]" />
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-[#7A6F66] mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl bg-[#F6F1EA] border border-[#E6DDD1] focus:outline-none focus:border-[#A65D47]" />
      </div>
      <button type="submit"
        class="w-full py-3.5 rounded-full bg-[#A65D47] hover:bg-[#8E4C38] text-white font-medium transition shadow-sm">
        Enter Admin Studio
      </button>
    </form>
  </div>
</body>
</html>
